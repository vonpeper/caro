server {
    listen 80 default_server;
    server_name _;

    # Prevenir indexación y caché de cualquier respuesta
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # Endpoint para healthcheck interno de Podman
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Raíz: responder 200 a peticiones de localhost / wget interno para el healthcheck de Podman
    location = / {
        if ($host = "127.0.0.1") {
            default_type text/plain;
            return 200 "healthy\n";
        }
        if ($http_user_agent ~* "Wget") {
            default_type text/plain;
            return 200 "healthy\n";
        }
        return 404;
    }

    # Todo lo demás devuelve 404 Not Found
    location / {
        return 404;
    }
}
